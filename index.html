<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Conversation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     THEME  —  colours & type pulled from the mockup
     ============================================================ */
  :root{
    --bg-deep:      #17110c;                 /* warm near-black so orange pops */
    --panel:        rgba(30, 22, 16, 0.74);
    --panel-edge:   rgba(243, 107, 22, 0.22);
    --bubble-aira:  rgba(60, 38, 20, 0.60);  /* warm, brand-leaning */
    --bubble-you:   rgba(46, 38, 30, 0.66);  /* neutral warm */
    --name-aira:    #F97316;                 /* Banglalink orange */
    --name-you:     #FBB04C;                 /* lighter amber for the user */
    --text:         #fdf4ea;                 /* warm white */
    --text-dim:     #c6b0a0;                 /* warm grey */
    --grad-a:       #F36B16;                 /* brand bright orange */
    --grad-b:       #FBA919;                 /* brand amber/yellow */
    --brand:        #F36B16;
    --online:       #34d17a;                 /* success green (kept for the ✓) */
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:#000;
    font-family:"Poppins","Noto Sans Bengali",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  /* Phone frame — fills the screen on a real phone,
     shows as a phone-shaped card on a laptop */
  .stage{
    position:relative;
    width:100vw; height:100vh;
    max-width:430px; max-height:932px;
    background:var(--bg-deep);
    overflow:hidden;
  }
  @media (min-width:640px){
    .stage{ border-radius:44px; box-shadow:0 40px 120px rgba(0,0,0,.6); }
  }

  /* ---------- avatar video ---------- */
  .avatar-wrap{ position:absolute; inset:0; }
  .avatar-wrap video,
  .avatar-wrap .poster{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  /* fallback gradient if no video file is present yet */
  .poster{
    background:
      radial-gradient(120% 80% at 50% 20%, #5c3a12 0%, #2a1c10 55%, #17110c 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .poster span{ color:rgba(255,255,255,.28); font-size:15px; letter-spacing:.02em; }
  /* darken the bottom so the panel reads clearly */
  .scrim{
    position:absolute; inset:0;
    background:linear-gradient(to bottom, transparent 40%, rgba(20,14,8,.55) 78%, rgba(20,14,8,.94) 100%);
    pointer-events:none;
  }
  /* catches taps so they can't hit the video's native play/pause gesture */
  .tap-catch{ position:absolute; inset:0; z-index:20; background:transparent; }

  /* ---------- status bar ---------- */
  .statusbar{
    position:absolute; top:0; left:0; right:0; z-index:5;
    height:54px; padding:0 26px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:16px; font-weight:600;
  }
  .statusbar .icons{ display:flex; align-items:center; gap:7px; }
  .statusbar svg{ display:block; }

  /* ---------- header ---------- */
  .header{
    position:absolute; top:54px; left:0; right:0; z-index:5;
    height:52px; padding:0 20px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .header .title{
    display:flex; align-items:center; gap:10px;
    font-size:17px; font-weight:500;
  }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--online);
        box-shadow:0 0 8px var(--online); }
  .icon-btn{ width:34px; height:34px; display:flex; align-items:center; justify-content:center;
             color:#fff; opacity:.9; }

  /* Banglalink wordmark */
  .brand{ display:flex; align-items:center; gap:8px;
          padding:5px 14px 5px 10px; border-radius:20px;
          background:rgba(0,0,0,.26);
          -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .brand .mark{ width:17px; height:17px; border-radius:6px;
                background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
                box-shadow:0 2px 6px rgba(243,107,22,.5); }
  .brand .wm{ font-weight:600; font-size:16px; letter-spacing:-.01em; color:#fff; }

  /* tap-for-sound button — sits above the tap-catch layer so it's tappable */
  .sound-hint{ position:absolute; top:114px; left:50%; transform:translateX(-50%);
               z-index:21; display:flex; align-items:center; gap:7px;
               background:rgba(30,20,12,.74); color:#fff;
               border:1px solid rgba(243,107,22,.45); border-radius:22px;
               padding:10px 18px; font-size:14px; font-weight:500; cursor:pointer;
               -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
               box-shadow:0 6px 20px rgba(0,0,0,.35);
               animation:pulseHint 1.6s ease-in-out infinite; }
  .sound-hint.hidden{ display:none; }
  @keyframes pulseHint{ 0%,100%{ opacity:.82; transform:translateX(-50%) scale(1) }
                        50%{ opacity:1; transform:translateX(-50%) scale(1.04) } }

  /* ---------- transcript panel ---------- */
  .panel{
    position:absolute; left:0; right:0; bottom:0; z-index:6;
    background:var(--panel);
    -webkit-backdrop-filter:blur(24px); backdrop-filter:blur(24px);
    border-top:1px solid var(--panel-edge);
    border-radius:26px 26px 0 0;
    padding:14px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .grabber{ width:44px; height:5px; border-radius:3px; background:rgba(255,255,255,.22);
            margin:2px auto 16px; }

  .panel-head{ display:flex; align-items:center; gap:11px; margin-bottom:16px; padding-left:2px; }
  .panel-head .label{ font-size:19px; font-weight:600; letter-spacing:.01em; }
  .wave{ display:flex; align-items:center; gap:3px; height:22px; }
  .wave i{ width:3px; border-radius:2px; background:linear-gradient(var(--grad-b),var(--grad-a));
           animation:wave 1s ease-in-out infinite; }
  .wave i:nth-child(1){ height:8px;  animation-delay:0s;   }
  .wave i:nth-child(2){ height:16px; animation-delay:.12s; }
  .wave i:nth-child(3){ height:22px; animation-delay:.24s; }
  .wave i:nth-child(4){ height:13px; animation-delay:.36s; }
  .wave i:nth-child(5){ height:19px; animation-delay:.48s; }
  .wave i:nth-child(6){ height:9px;  animation-delay:.6s;  }
  @keyframes wave{ 0%,100%{ transform:scaleY(.5); opacity:.6 } 50%{ transform:scaleY(1); opacity:1 } }

  /* ---------- chat ---------- */
  /* Fixed-height scroll area — the sheet never grows, so the video
     above it is never squeezed. New lines scroll up inside this box. */
  .chat{ display:flex; flex-direction:column; gap:14px;
         height:clamp(170px, 26vh, 240px);
         overflow-y:auto; overscroll-behavior:contain;
         margin-bottom:18px; padding-right:4px;
         scrollbar-width:none; -ms-overflow-style:none;
         -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 24px);
                 mask-image:linear-gradient(to bottom, transparent 0, #000 24px); }
  .chat::-webkit-scrollbar{ display:none; }
  .row{ display:flex; align-items:flex-start; gap:11px;
        opacity:0; transform:translateY(8px); animation:pop .35s ease forwards; }
  .row.you{ flex-direction:row-reverse; }
  @keyframes pop{ to{ opacity:1; transform:none } }

  .pfp{ flex:0 0 auto; width:44px; height:44px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        font-weight:600; font-size:16px; overflow:hidden; }
  .pfp.aira{ background:linear-gradient(135deg,var(--grad-a),var(--grad-b)); color:#fff; }
  .pfp.you{ background:transparent; border:1.5px solid var(--name-you); color:var(--name-you); }
  .pfp img{ width:100%; height:100%; object-fit:cover; }

  .bubble{ max-width:76%; border-radius:20px; padding:11px 15px; }
  .bubble.aira{ background:var(--bubble-aira); border-top-left-radius:6px; }
  .bubble.you{ background:var(--bubble-you); border-top-right-radius:6px; text-align:left; }
  .who{ font-size:13.5px; font-weight:600; margin-bottom:4px; }
  .who.aira{ color:var(--name-aira); }
  .who.you{ color:var(--name-you); text-align:right; }
  .msg{ font-size:16.5px; line-height:1.42; }
  .cursor{ display:inline-block; width:2px; height:1.05em; vertical-align:-2px;
           background:var(--name-you); margin-left:2px; animation:blink .9s steps(1) infinite; }
  .row.aira .cursor{ background:var(--name-aira); }
  @keyframes blink{ 50%{ opacity:0 } }

  /* typing dots */
  .dots{ display:inline-flex; gap:5px; padding:3px 2px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:var(--text-dim);
           animation:bounce 1.1s ease-in-out infinite; }
  .dots i:nth-child(2){ animation-delay:.15s; }
  .dots i:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,80%,100%{ transform:translateY(0); opacity:.4 } 40%{ transform:translateY(-4px); opacity:1 } }

  /* on-screen action steps (e.g. checking / turning on DND) */
  .action{ align-self:center; display:flex; align-items:center; gap:9px;
           background:rgba(40,28,18,.74); border:1px solid rgba(243,107,22,.24);
           border-radius:14px; padding:9px 15px; max-width:90%;
           font-size:14.5px; color:var(--text-dim);
           opacity:0; animation:pop .3s ease forwards; }
  .action.done{ color:var(--text); }
  .action .spin{ flex:0 0 auto; width:15px; height:15px; border-radius:50%;
                 border:2px solid rgba(255,255,255,.18); border-top-color:var(--name-you);
                 animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .action .check{ flex:0 0 auto; width:16px; height:16px; display:flex;
                  align-items:center; justify-content:center;
                  color:var(--online); font-weight:700; font-size:13px; }

  /* ---------- mode toggle ---------- */
  .modes{ display:flex; gap:6px; background:rgba(20,14,8,.55);
          border:1px solid rgba(255,255,255,.06); border-radius:18px; padding:6px; }
  .mode{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
         padding:11px 0; border-radius:13px; color:var(--text-dim); font-size:14px; font-weight:500;
         transition:.2s; }
  .mode svg{ width:22px; height:22px; }
  .mode.active{ background:linear-gradient(135deg,var(--grad-a),var(--grad-b)); color:#fff;
                box-shadow:0 6px 18px rgba(243,107,22,.42); }
  .mode.divider{ position:relative; }
</style>
</head>
<body>
<div class="stage">

  <!-- avatar video -->
  <div class="avatar-wrap">
    <video id="avatar" loop playsinline muted></video>
    <audio id="avatarAudio" loop></audio>
    <div class="poster" id="poster"><span>Drop your avatar video here → set CONFIG.avatarVideo</span></div>
    <div class="scrim"></div>
  </div>

  <!-- status bar -->
  <div class="statusbar">
    <span>9:41</span>
    <div class="icons">
      <!-- signal -->
      <svg width="19" height="13" viewBox="0 0 19 13" fill="#fff"><rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="8" rx="1"/><rect x="10" y="2.5" width="3" height="10.5" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/></svg>
      <!-- wifi -->
      <svg width="18" height="13" viewBox="0 0 18 13" fill="#fff"><path d="M9 2.2c2.9 0 5.6 1.1 7.6 3l-1.5 1.5A8.6 8.6 0 0 0 9 4.3 8.6 8.6 0 0 0 2.9 6.7L1.4 5.2A11 11 0 0 1 9 2.2Zm0 3.9c1.8 0 3.5.7 4.8 1.9l-1.5 1.5A5.2 5.2 0 0 0 9 8.1a5.2 5.2 0 0 0-3.3 1.4L4.2 8A7.1 7.1 0 0 1 9 6.1Zm0 3.9c.9 0 1.7.3 2.3.9L9 12.9 6.7 10.9c.6-.6 1.4-.9 2.3-.9Z"/></svg>
      <!-- battery -->
      <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#fff" opacity="0.5"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><rect x="24" y="4" width="1.5" height="5" rx="0.75" fill="#fff" opacity="0.6"/></svg>
    </div>
  </div>

  <!-- header -->
  <div class="header">
    <div class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>
    <div class="brand"><span class="mark"></span><span class="wm">banglalink</span></div>
    <div class="icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></div>
  </div>

  <!-- tap to enable audio -->
  <button id="soundHint" class="sound-hint">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M18 6a8 8 0 0 1 0 12" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    Double Tap for sound
  </button>

  <!-- transcript panel -->
  <div class="panel">
    <div class="grabber"></div>
    <div class="panel-head">
      <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="label">Live transcript</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="modes">
      <div class="mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Text
      </div>
      <div class="mode">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="9" width="2" height="6" rx="1"/><rect x="6" y="6" width="2" height="12" rx="1"/><rect x="10" y="3" width="2" height="18" rx="1"/><rect x="14" y="6" width="2" height="12" rx="1"/><rect x="18" y="9" width="2" height="6" rx="1"/></svg>
        Voice
      </div>
      <div class="mode active">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg>
        Video
      </div>
    </div>
  </div>

  <!-- catches taps so they unmute but can't pause the video -->
  <div class="tap-catch" id="tapCatch"></div>
</div>

<script>
/* ================================================================
   EDIT EVERYTHING HERE
   ================================================================ */
const CONFIG = {
  avatarName:  "Aira",
  avatarVideo: "avatar.mp4",   // put your lip-synced clip next to this file
  avatarImage: "",             // optional: photo URL for Aira's little circle (else shows "A")

  loop:              true,     // replay the whole conversation on a loop
  startDelay:        900,      // ms before the first line
  typingSpeed:       28,       // ms per character (lower = faster typing)
  typingIndicator:   850,      // ms the "…" dots show before each incoming line
  pauseAfterMessage: 1500,     // ms to hold after a line finishes
  actionTime:        1300,     // ms each on-screen action step stays "in progress"
  loopGap:           3200,     // ms pause before restarting the loop

  // The scripted conversation.
  //   { speaker:"aira"|"you", text:"..." }  → a chat bubble
  //   { action:"..." }                      → an on-screen action step (spinner → check)
  script: [
    { speaker:"you",  text:"হ্যালো! আমার ফোনে অনেক প্রোমোশনাল এসএমএস আসছে। আমি এগুলো বন্ধ করতে চাই।" },
    { speaker:"aira", text:"ওহ্, বুঝতে পারছি—এটা বেশ বিরক্তিকর। আপনি কি আপনার ডিএনডি সেটিংটি চালু করতে চান? এটি চালু করলে বাংলালিংকের কোনো প্রোমোশনাল এসএমএস আর আপনার নম্বরে আসবে না।" },
    { speaker:"you",  text:"হ্যাঁ, প্লিজ। এটা চালু করে দিন।" },
    { speaker:"aira", text:"ঠিক আছে, আমি এখনই করে দিচ্ছি।" },
    { action:"ডিএনডি সেটিং যাচাই করা হচ্ছে…" },
    { action:"ডিএনডি চালু করা হচ্ছে…" },
    { speaker:"aira", text:"হয়ে গেছে! আপনার নম্বরে ডিএনডি চালু হয়েছে। ভবিষ্যতে সেটিংটি পরিবর্তন করতে চাইলে MyBL-এর সেলফ কেয়ার সেকশনে যেতে পারেন। অথবা যেকোনো সাহায্যের জন্য আবার আমার কাছেই চলে আসুন!" },
  ],
};
/* ================================================================ */

// wire up the video / fallback
(function(){
  const v = document.getElementById('avatar');
  const poster = document.getElementById('poster');
  if(CONFIG.avatarVideo){
    v.src = CONFIG.avatarVideo;
    v.addEventListener('loadeddata', ()=> poster.style.display='none');
    v.addEventListener('error', ()=>{ v.style.display='none'; poster.style.display='flex'; });
  } else { v.style.display='none'; }
})();

const chat = document.getElementById('chat');
const wait = ms => new Promise(r=>setTimeout(r,ms));
const toBottom = () => { chat.scrollTop = chat.scrollHeight; };

// split text into grapheme clusters so Bangla conjuncts type as one unit
const seg = (typeof Intl !== 'undefined' && Intl.Segmenter)
  ? new Intl.Segmenter(undefined, { granularity:'grapheme' }) : null;
function graphemes(text){
  return seg ? Array.from(seg.segment(text), s => s.segment) : Array.from(text);
}

function makeRow(speaker){
  const who = speaker === 'aira' ? CONFIG.avatarName : 'You';
  const row = document.createElement('div');
  row.className = 'row ' + speaker;

  const pfp = document.createElement('div');
  pfp.className = 'pfp ' + speaker;
  if(speaker==='aira'){
    if(CONFIG.avatarImage){ pfp.innerHTML = `<img src="${CONFIG.avatarImage}" alt="">`; }
    else{ pfp.textContent = CONFIG.avatarName.charAt(0); }
  } else {
    pfp.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + speaker;
  bubble.innerHTML = `<div class="who ${speaker}">${who}</div><div class="msg"></div>`;

  row.appendChild(pfp);
  row.appendChild(bubble);
  chat.appendChild(row);
  return { row, msg: bubble.querySelector('.msg') };
}

async function typeInto(el, text){
  el.textContent = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  for(const ch of graphemes(text)){
    cursor.insertAdjacentText('beforebegin', ch);
    toBottom();
    await wait(CONFIG.typingSpeed);
  }
  await wait(CONFIG.pauseAfterMessage);
  cursor.remove();
}

async function showTyping(speaker){
  const { row, msg } = makeRow(speaker);
  toBottom();
  msg.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  toBottom();
  await wait(CONFIG.typingIndicator);
  msg.innerHTML = '';
  return msg;
}

function finishPendingActions(){
  chat.querySelectorAll('.action:not(.done)').forEach(row=>{
    row.classList.add('done');
    const s = row.querySelector('.spin');
    if(s){ const c = document.createElement('span'); c.className='check'; c.textContent='✓'; s.replaceWith(c); }
  });
}

async function showAction(text){
  finishPendingActions();           // previous step ticks over to done
  const row = document.createElement('div');
  row.className = 'action';
  row.innerHTML = '<span class="spin"></span><span class="atext"></span>';
  row.querySelector('.atext').textContent = text;
  chat.appendChild(row);
  toBottom();
  await wait(CONFIG.actionTime);
}

async function runConversation(){
  chat.innerHTML = '';
  await wait(CONFIG.startDelay);
  for(const line of CONFIG.script){
    if(line.action !== undefined){
      await showAction(line.action);
    } else {
      finishPendingActions();       // any spinning step completes before the reply
      const msg = await showTyping(line.speaker);
      await typeInto(msg, line.text);
    }
  }
  finishPendingActions();
  if(CONFIG.loop){ await wait(CONFIG.loopGap); runConversation(); }
}

runConversation();

// Audio + tap handling.
// The video stays MUTED forever — on iOS, unmuting a playing inline video makes
// it pause, and it won't resume without another gesture (that was the bug). So we
// play the sound from a SEPARATE audio element instead, kept in sync with the video.
// One tap starts it; the video never pauses because it's never touched.
(function(){
  const video   = document.getElementById('avatar');
  const audio   = document.getElementById('avatarAudio');
  const catcher = document.getElementById('tapCatch');
  const hint    = document.getElementById('soundHint');
  if(!CONFIG.avatarVideo) return;

  video.muted = true;
  video.play().catch(()=>{});

  audio.src = CONFIG.avatarVideo;   // same file — the audio element plays its sound track
  audio.volume = 1;

  let soundOn = false;
  function enableSound(e){
    if(e && e.cancelable) e.preventDefault();
    if(soundOn) return;
    try{ audio.currentTime = video.currentTime || 0; }catch(_){}
    audio.play().then(()=>{
      soundOn = true;
      if(hint) hint.classList.add('hidden');
    }).catch(()=>{});
  }

  ['click','touchstart'].forEach(ev=>{
    if(hint)    hint.addEventListener(ev, enableSound, { passive:false });
    if(catcher) catcher.addEventListener(ev, enableSound, { passive:false });
  });

  // keep the audio lined up with the looping video
  setInterval(()=>{
    if(soundOn && Math.abs((audio.currentTime||0) - (video.currentTime||0)) > 0.3){
      try{ audio.currentTime = video.currentTime || 0; }catch(_){}
    }
  }, 2000);

  // resume both if the app was backgrounded
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden){
      video.play().catch(()=>{});
      if(soundOn) audio.play().catch(()=>{});
    }
  });
})();
</script>
</body>
</html>
